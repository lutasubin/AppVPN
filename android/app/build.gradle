plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.Lutasubin.freeVpn"
    compileSdk = 35

    // ✅ fix cứng NDK r28 (hỗ trợ 16KB page size)
    ndkVersion "28.0.12674087" 

    lint {
        disable 'InvalidPackage'
    }

    packaging {
        jniLibs {
            // Force extraction for runtime execution of .so (OpenVPN/Stunnel)
            useLegacyPackaging true
        }
        resources {
            pickFirsts += [
                '**/libopenvpn.so',
                '**/libopvpnutil.so',
                '**/libovpnexec.so',
                '**/libstunnel.so',
            ]
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.Lutasubin.freeVpn"
        minSdk = 23
        targetSdk = 35
        versionCode 46
        versionName '2.8.6'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release // ✅ tránh lỗi khi debug trên máy thật
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // VPN modules
    implementation project(path: ':vpnLib')
    implementation project(path: ':vpnLib:tunnel')

    // AndroidX
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation("androidx.work:work-runtime") {
        version {
            strictly("2.9.0")
        }
    }
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Java 8+ APIs support
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // Google SDKs
    implementation 'com.google.android.ump:user-messaging-platform:2.1.0'
    implementation 'com.google.android.gms:play-services-ads:24.4.0'
}
